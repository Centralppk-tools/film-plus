<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070709" />
  <title>Фильм+</title>
  <link rel="manifest" href="manifest.json" />
  <script type="module" crossorigin src="/film-plus/assets/index-CuotI5P5.js"></script>
  <link rel="stylesheet" crossorigin href="/film-plus/assets/index-A8TVy7_m.css">
</head>
<body class="app-body min-h-screen antialiased">

  <div class="ambient-bg" aria-hidden="true">
    <span class="ambient-orb ambient-orb-a"></span>
    <span class="ambient-orb ambient-orb-b"></span>
    <span class="ambient-orb ambient-orb-c"></span>
  </div>

  <header id="mainHeader" class="glass-header sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 pt-[max(0.75rem,env(safe-area-inset-top))] pb-3">
      <div class="flex items-center gap-3 md:gap-4">
        <button id="logoBtn" type="button" class="brand-btn shrink-0" aria-label="На главную">
          <span class="brand-dot"></span>
          <span class="brand-text">Фильм+</span>
        </button>
        <div id="headerSearchWrap" class="relative flex-1 max-md:hidden">
          <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off"
            placeholder="Фильм, сериал или аниме"
            class="glass-input w-full" />
          <button id="clearSearchBtn" type="button" class="search-clear hidden" aria-label="Очистить">✕</button>
          <div id="searchSuggestions" class="search-suggestions hidden"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="mainView" class="main-shell max-w-6xl mx-auto px-4 pb-28 md:pb-10">

    <section id="searchPanel" class="md:hidden mb-4 hidden">
      <div class="relative">
        <input id="searchInputMobile" type="search" enterkeyhint="search" autocomplete="off"
          placeholder="Поиск"
          class="glass-input w-full" />
        <button id="clearSearchBtnMobile" type="button" class="search-clear hidden" aria-label="Очистить">✕</button>
        <div id="searchSuggestionsMobile" class="search-suggestions hidden"></div>
      </div>
    </section>

    <section id="homePanels">
      <section id="heroSection" class="hero-banner hidden mb-8 mt-2 md:mt-4"></section>

      <section id="historySection" class="shelf-section hidden">
        <div class="shelf-head">
          <h2 class="shelf-title">Продолжить просмотр</h2>
          <button id="clearHistoryBtn" type="button" class="text-btn">Очистить</button>
        </div>
        <div id="historyList" class="history-rail no-scrollbar"></div>
      </section>

      <section id="watchlistSection" class="shelf-section hidden">
        <div class="shelf-head">
          <h2 class="shelf-title">Лайки</h2>
        </div>
        <div id="watchlistGrid" class="movie-grid"></div>
        <p id="watchlistEmpty" class="empty-hint hidden">Добавляйте фильмы в избранное на странице просмотра</p>
      </section>

      <section id="catalogSection" class="shelf-section">
        <div id="filterChips" class="chip-rail no-scrollbar mb-4"></div>
        <div class="shelf-head">
          <h2 id="catalogTitle" class="shelf-title">Популярное сейчас</h2>
          <span id="statusBadge" class="status-pill"></span>
        </div>
        <div id="catalogViewport">
          <div id="moviesGrid" class="movie-grid"></div>
          <div id="loadMoreSkeleton" class="load-more-skeleton movie-grid hidden" aria-hidden="true"></div>
          <div id="scrollSentinel" class="scroll-sentinel" aria-hidden="true"></div>
        </div>
      </section>
    </section>

    <section id="favoritesView" class="hidden">
      <div class="shelf-head mt-2">
        <h2 class="shelf-title">Лайки</h2>
      </div>
      <div id="favoritesGrid" class="movie-grid"></div>
      <p id="favoritesEmpty" class="empty-hint">Пока пусто. Нажмите сердечко на странице фильма</p>
    </section>

  </main>

  <nav id="mobileTabBar" class="tab-bar md:hidden" aria-label="Навигация">
    <button type="button" class="tab-item tab-item-active" data-nav="home" aria-current="page">
      <span class="tab-icon">⌂</span>
      <span>Главная</span>
    </button>
    <button type="button" class="tab-item" data-nav="search">
      <span class="tab-icon">⌕</span>
      <span>Поиск</span>
    </button>
    <button type="button" class="tab-item" data-nav="favorites">
      <span class="tab-icon">♥</span>
      <span>Лайки</span>
    </button>
  </nav>

  <div id="playerModal" class="player-modal hidden" role="dialog" aria-modal="true">
    <div id="modalAmbient" class="modal-ambient" aria-hidden="true"></div>
    <div class="modal-scrim"></div>

    <div class="modal-sheet">
      <div class="player-toolbar">
        <div class="player-source-picker">
          <button
            type="button"
            id="playerSourceBtn"
            class="source-pill"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="playerSourceMenu"
          >
            <span class="source-pill-prefix">Плеер:</span>
            <span id="playerSourceName">Collaps</span>
            <span class="source-caret" aria-hidden="true">▾</span>
          </button>
          <div id="playerSourceMenu" class="source-menu hidden" role="listbox" aria-label="Источник плеера">
            <button type="button" class="source-menu-item source-menu-item-active" data-player-id="collaps" role="option">
              Collaps
            </button>
            <button type="button" class="source-menu-item" data-player-id="alloha" role="option">
              Alloha
            </button>
          </div>
        </div>
        <button type="button" id="closeModalBtn" class="modal-close-btn" aria-label="Закрыть">✕</button>
      </div>

      <div id="playerContainer" class="player-stage player-stage-clean">
        <div id="playerMount" class="player-mount"></div>
      </div>

      <div id="playerScrubber" class="player-scrubber hidden" aria-label="Прогресс просмотра">
        <p id="scrubberHint" class="scrubber-hint hidden"></p>
        <div class="scrubber-row">
          <button type="button" id="scrubberCurrent" class="scrubber-time scrubber-time-btn">0:00</button>
          <div class="scrubber-track-wrap">
            <div class="scrubber-track-visual" aria-hidden="true">
              <div id="scrubberFill" class="scrubber-fill"></div>
            </div>
            <input
              type="range"
              id="scrubberRange"
              class="scrubber-range"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Прогресс серии"
            />
          </div>
          <button type="button" id="scrubberDuration" class="scrubber-time scrubber-time-end scrubber-time-btn">42:00</button>
          <button
            type="button"
            id="scrubberJumpBtn"
            class="scrubber-jump-btn"
            title="Перейти к сохранённому месту"
            aria-label="Перейти к сохранённому месту"
          >
            ▸|
          </button>
          <button type="button" id="scrubberWatchedBtn" class="scrubber-watched-btn">
            Просмотрено ✓
          </button>
        </div>
      </div>

      <section id="seriesBlock" class="series-block hidden" aria-label="Серии">
        <div id="seasonTabs" class="season-tabs no-scrollbar"></div>
        <div id="episodeRail" class="episode-rail no-scrollbar"></div>
      </section>

      <div class="modal-info">
        <img id="modalPoster" src="" alt="" class="modal-poster" />
        <div class="modal-copy">
          <div class="modal-title-row">
            <h1 id="modalTitle" class="modal-title"></h1>
            <button type="button" id="likeBtn" class="like-btn" aria-label="В избранное" aria-pressed="false">
              <span class="like-icon" aria-hidden="true">♡</span>
            </button>
          </div>
          <div id="modalMeta" class="modal-meta"></div>
          <p id="modalDesc" class="modal-desc"></p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
