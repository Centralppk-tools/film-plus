<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />
  <title>Кинозал</title>
  <link rel="manifest" href="manifest.json" />
  <script type="module" crossorigin src="/film-plus/assets/index-BbWiXM2j.js"></script>
  <link rel="stylesheet" crossorigin href="/film-plus/assets/index-ps97mKbG.css">
</head>
<body class="min-h-screen antialiased selection:bg-orange-500 selection:text-white">

  <header class="sticky top-0 z-30 bg-zinc-950/85 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center gap-3">
      <button id="logoBtn" class="text-lg font-bold tracking-tight text-white flex items-center gap-2 shrink-0">
        <span class="w-3 h-3 rounded-full bg-orange-500 inline-block"></span>
        <span>Кинозал</span>
      </button>
      <div class="relative flex-1">
        <input
          id="searchInput"
          type="search"
          placeholder="Фильм, сериал или аниме..."
          class="w-full bg-zinc-900 text-sm text-white placeholder-zinc-500 rounded-xl pl-4 pr-10 py-2.5 border border-zinc-800 focus:outline-none focus:border-orange-500 transition"
        />
        <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-sm">
          ✕
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-5 space-y-8">

    <section id="historySection" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-zinc-100">Продолжить просмотр</h2>
        <button id="clearHistoryBtn" class="text-xs text-zinc-500 hover:text-zinc-300">Очистить</button>
      </div>
      <div id="historyList" class="flex gap-3 overflow-x-auto no-scrollbar pb-1"></div>
    </section>

    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="catalogTitle" class="text-base font-semibold text-zinc-100">Популярное сейчас</h2>
        <span id="statusBadge" class="text-xs text-zinc-500"></span>
      </div>
      <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4"></div>
    </section>

  </main>

  <div id="playerModal" class="fixed inset-0 z-50 hidden bg-zinc-950/95 backdrop-blur-lg overflow-y-auto">
    <div class="max-w-4xl mx-auto min-h-screen flex flex-col p-4 pb-10">

      <div class="flex items-center justify-between py-2 mb-3">
        <button id="closeModalBtn" class="px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-sm text-zinc-200 hover:bg-zinc-800">
          Назад
        </button>
        <span id="modalKpId" class="text-xs text-zinc-500 font-mono"></span>
      </div>

      <div id="playerSourceTabs" class="hidden flex flex-wrap gap-2 mb-2"></div>

      <div id="playerContainer" class="w-full aspect-video min-h-[320px] bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 relative">
        <div id="playerMount" class="w-full h-full min-h-[320px] flex items-center justify-center"></div>
      </div>

      <div class="mt-4 p-3 rounded-xl bg-zinc-900/80 border border-zinc-800/80 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-xs text-zinc-300">
          <span>Сезон:</span>
          <input id="seasonInput" type="number" min="1" value="1" class="w-14 bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1 text-center text-white" />
          <span>Серия:</span>
          <input id="episodeInput" type="number" min="1" value="1" class="w-14 bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1 text-center text-white" />
        </div>
        <button id="saveProgressBtn" class="px-3 py-1.5 rounded-lg bg-orange-500 hover:bg-orange-600 text-xs font-medium text-white transition">
          Сохранить точку остановки
        </button>
      </div>

      <div class="mt-5 flex gap-4">
        <img id="modalPoster" src="" alt="" class="w-24 sm:w-32 rounded-xl object-cover bg-zinc-900 shrink-0" />
        <div class="space-y-2">
          <h1 id="modalTitle" class="text-xl sm:text-2xl font-bold text-white leading-tight"></h1>
          <div id="modalMeta" class="flex flex-wrap gap-2 text-xs text-zinc-400"></div>
          <p id="modalDesc" class="text-sm text-zinc-300 leading-relaxed"></p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
